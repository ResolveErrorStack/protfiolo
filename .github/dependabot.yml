version: 2

updates:

  # Node.js / PNPM Dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"

    commit-message:
      prefix: "deps"

  # GitHub Actions Updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 10

    labels:
      - "github-actions"

    commit-message:
      prefix: "ci"

  # Docker Image Updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"

    open-pull-requests-limit: 5

    labels:
      - "docker"

    commit-message:
      prefix: "docker"
