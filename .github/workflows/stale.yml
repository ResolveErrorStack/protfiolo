name: Stale

on:
  schedule:
    - cron: "30 1 * * *" # Runs daily at 01:30 UTC

  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Issues & PRs
    runs-on: ubuntu-latest

    steps:
      - name: Close Stale Issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          days-before-stale: 30
          days-before-close: 7

          stale-issue-message: >
            👋 This issue has been automatically marked as stale because it has had
            no activity for 30 days. It will be closed in 7 days if there is no
            further activity.

          close-issue-message: >
            ✅ This issue has been automatically closed due to inactivity.

          stale-pr-message: >
            👋 This pull request has been marked as stale because it has had no
            activity for 30 days. It will be closed in 7 days if there is no
            further activity.

          close-pr-message: >
            ✅ This pull request has been automatically closed due to inactivity.

          exempt-issue-labels: |
            pinned
            security
            bug
            enhancement

          exempt-pr-labels: |
            pinned
            security

          operations-per-run: 100
