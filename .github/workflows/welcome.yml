name: Welcome Contributors

on:
  issues:
    types:
      - opened

  pull_request:
    types:
      - opened

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Welcome New Contributors
    runs-on: ubuntu-latest

    steps:
      - name: Welcome First Time Contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          issue-message: |
            👋 Hello @${{ github.actor }}!

            Thank you for opening your first issue in **ResolveErrorStack Portfolio** 🚀

            We appreciate your contribution.
            Our team will review your issue soon.

            Happy Coding! 💻✨

          pr-message: |
            🎉 Hello @${{ github.actor }}!

            Thank you for your first Pull Request to **ResolveErrorStack Portfolio** 🚀

            We appreciate your effort and contribution.

            A maintainer will review it soon.
            
            Keep building! 🔥
