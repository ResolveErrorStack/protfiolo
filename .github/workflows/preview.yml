name: Preview

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Preview Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test --if-present

      - name: Build Preview
        run: pnpm build

      - name: Upload Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: |
            .next
            dist
            out
          if-no-files-found: ignore
          retention-days: 7

      - name: Preview Summary
        run: |
          echo "✅ Preview build completed successfully."
          echo "Ready for review before merging."
