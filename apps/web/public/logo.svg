<svg 
  width="512" 
  height="512" 
  viewBox="0 0 512 512" 
  fill="none" 
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- Background -->
  <rect 
    width="512" 
    height="512" 
    rx="120" 
    fill="#050505"
  />


  <!-- Infinity Circuit -->
  <path
    d="
    M256 160
    C190 90 80 130 80 256
    C80 382 190 422 256 352
    C322 422 432 382 432 256
    C432 130 322 90 256 160Z
    "
    stroke="#00E5FF"
    stroke-width="24"
    fill="none"
  />


  <!-- Red Signal -->
  <path
    d="
    M256 256
    C300 210 360 210 400 256
    "
    stroke="#FF1744"
    stroke-width="18"
    stroke-linecap="round"
  />


  <!-- Center E -->
  <circle
    cx="256"
    cy="256"
    r="65"
    fill="#111111"
    stroke="#C0C0C0"
    stroke-width="8"
  />


  <text
    x="256"
    y="280"
    text-anchor="middle"
    fill="#FFFFFF"
    font-size="90"
    font-family="Arial, sans-serif"
    font-weight="bold"
  >
    E
  </text>


  <!-- Circuit dots -->
  <circle cx="120" cy="256" r="8" fill="#00E5FF"/>
  <circle cx="392" cy="256" r="8" fill="#FF1744"/>

</svg>
